<style>
  :root { color-scheme: dark; font-family: "SF Pro Text", system-ui, sans-serif; --accent: #8fb3e0; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; color: #e7e9ec;
         background: radial-gradient(50rem 35rem at 10% -10%, #1b2027 0, transparent 60%), #0e1013; }
  main { width: min(100%, 22rem); } /* la carte ne dépasse jamais de l'écran (iPhone) */
  form { display: grid; gap: .9rem; padding: 1.6rem; border-radius: 22px; background: #181b1f;
         border: 1px solid rgb(255 255 255 / .08); box-shadow: 0 12px 32px -14px rgb(0 0 0 / .6); }
  h1 { margin: 0 0 .3rem; display: flex; align-items: center; gap: .6rem; font-size: 1.6rem; font-weight: 650; line-height: 1; letter-spacing: -.03em; }
  h1 svg { width: 40px; height: 29px; }
  label { display: grid; gap: .3rem; font-size: .85rem; color: #b8bec7; }
  input { font: inherit; font-size: 1rem; color: #e7e9ec; min-height: 2.75rem; padding: .5rem .8rem; border-radius: 10px; border: 1px solid #353a42; background: #17191d; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; min-height: 2.75rem; border: 0; border-radius: 99px; color: #fff; cursor: pointer; background: linear-gradient(135deg, #36659f, #284d7a); }
  button:disabled { opacity: .6; cursor: progress; }
  #err { margin: 0; color: #fca5a5; font-size: .88rem; }
  small { color: #9aa1ab; }
</style>
